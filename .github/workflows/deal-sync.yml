name: "2-Hour Autonomous Deals & Price Sync"

on:
  schedule:
    # Runs every 2 hours (00:00, 02:00, 04:00, etc. UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  sync-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run 2-Hour Deals & Price Compliance Engine
        run: |
          node -e "
          const dealCurator = require('./lib/deal-curator');
          dealCurator.runDailyCuration().then(r => {
            console.log('Sync complete:', r.publishedCount, 'deals published,', r.rejectedCount, 'rejected.');
          }).catch(e => {
            console.error('Sync failed:', e);
            process.exit(1);
          });
          "

      - name: Commit and Push Updated Deals
        run: |
          git config --global user.name "NKiaX Autonomous Sync Bot"
          git config --global user.email "bot@nkiax.com"
          git add data/verified-products.json data/audit-logs.json data/price-deltas.json
          if git diff --staged --quiet; then
            echo "No catalog changes detected."
          else
            git commit -m "chore(bot): 2-hour autonomous deals & price compliance sync [skip ci]"
            git push origin master
          fi
